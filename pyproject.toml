[tool.poetry]
name = "csfd-export"
version = "1.2.0"
description = "A website that allows you to export your ČSFD film ratings."
authors = ["Jakub Valenta <jakub@jakubvalenta.cz>"]
license = "GPLv3+"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
beautifulsoup4 = "^4.14.3"
celery = {extras = ["redis"], version = "^5.6.3"}
django-ratelimit = "^4.1.0"
django = "^5.2.17"
requests = "^2.33.1"

[tool.poetry.group.dev.dependencies]
celery-types = "^0.26.0"
django-stubs = {version = "^5.2.9", extras = ["compatible-mypy"]}
mypy = "^1.19.1"
pytest = "^9.0.3"
types-beautifulsoup4 = "^4.12.0"
types-requests = "^2.32.4"
ruff = "^0.15.14"

[tool.django-stubs]
django_settings_module = "csfd_export.settings"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["django_ratelimit.decorators"]
ignore_missing_imports = true

[tool.poetry.scripts]
csfd-export = "csfd_export.cli:main"

[tool.ruff]
extend-exclude = ["migrations"]
line-length = 100

[tool.ruff.lint]
select = ["C90", "D", "DJ", "E", "F", "I", "N", "PT"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D211", "D212", "PT009"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
